name: Hent offisiell norsk Sativex-SPC
on:
  pull_request:
    paths:
      - .github/workflows/les-norsk-spc.yml
permissions:
  contents: read
jobs:
  les-spc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Last ned fra DMP og bekreft PDF-signatur
        shell: bash
        run: |
          set -euo pipefail
          url='https://produktinformasjon.legemiddelsok.no/preparatomtaler/11-8809.pdf'
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 -sS --output sativex.pdf "$url"
          echo "Kilde: $url"
          file sativex.pdf
          if [ "$(head -c 5 sativex.pdf)" != '%PDF-' ]; then
            echo 'Ikke en PDF'; exit 1
          fi
          pdfinfo sativex.pdf | head -n 18
          pdftotext -layout sativex.pdf sativex.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          txt = Path('sativex.txt').read_text(encoding='utf-8')
          print('UTF8_CHARS', len(txt))
          print('DOCUMENT_START')
          print(txt[:1400])
          matches=list(re.finditer(r'(?m)^\s*4\.8\s*\n?\s*Bivirkninger\s*$',txt,re.IGNORECASE))
          if not matches:
            matches=list(re.finditer(r'4\.8\s+Bivirkninger',txt,re.IGNORECASE))
          if not matches:
            raise SystemExit('Finner ikke 4.8 Bivirkninger')
          start=matches[-1].start()
          end=re.search(r'(?m)^\s*4\.9\s*\n?\s*Overdosering',txt[start:],re.IGNORECASE)
          excerpt=txt[start:start+end.start()] if end else txt[start:start+24000]
          print('BIVIRKNINGER_4_8_START')
          print(excerpt)
          print('BIVIRKNINGER_4_8_END')
          PY

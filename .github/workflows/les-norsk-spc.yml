name: Hent offisiell norsk Sativex-SPC
on:
  pull_request:
    paths:
      - .github/workflows/les-norsk-spc.yml
permissions:
  contents: read
jobs:
  les-spc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Last ned fra DMP og bekreft PDF-signatur
        shell: bash
        run: |
          set -euo pipefail
          url='https://produktinformasjon.legemiddelsok.no/preparatomtaler/11-8809.pdf'
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 -sS --output sativex.pdf "$url"
          echo "Kilde: $url"
          file sativex.pdf
          if [ "$(head -c 5 sativex.pdf)" != '%PDF-' ]; then
            echo 'Ikke en PDF'; exit 1
          fi
          python3 -m pip install --quiet --disable-pip-version-check pymupdf==1.26.4
          python3 - <<'PY'
          import re
          import pymupdf
          from pathlib import Path
          doc = pymupdf.open('sativex.pdf')
          print('PDF_PAGES',len(doc))
          parts=[]
          for n,page in enumerate(doc):
            page_txt=page.get_text('text',sort=True)
            parts.append(page_txt)
            print('PAGE',n+1,'CHARS',len(page_txt),'HAS_4_8',bool(re.search(r'4\\.8\\s*Bivirkninger',page_txt,re.I)))
          txt='\\n'.join(parts)
          print('DOCUMENT_START')
          print(txt[:1600])
          print('BIVIRKNINGS_TREFF')
          for i,part in enumerate(parts):
            lines=[x for x in part.splitlines() if 'bivirkning' in x.lower() or x.strip().startswith(('4.8','4.9'))]
            if lines: print('PAGE',i+1,repr(lines[:12]))
          print('FULL_SECTION_PAGES_5_THROUGH_11_START')
          for i in range(4,min(11,len(doc))):
            print('========== ORIGINAL PDF PAGE',i+1,'==========')
            print(parts[i])
          print('FULL_SECTION_PAGES_5_THROUGH_11_END')
          print('LAST_PAGE_REVISJON')
          print(parts[-1])
          import base64
          p8=doc[7]
          pix=p8.get_pixmap(matrix=pymupdf.Matrix(1.65,1.65),alpha=False)
          raw=base64.b64encode(pix.tobytes('jpeg',jpg_quality=72)).decode('ascii')
          print('ORIGINAL_PDF_SIDE8_JPEG_B64_BEGIN')
          for k in range(0,len(raw),16000): print('IMGCHUNK '+raw[k:k+16000])
          print('ORIGINAL_PDF_SIDE8_JPEG_B64_END')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Kontroller og forhåndsvis norsk SPC-import
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --silent
          sourcefile='supabase/import/bivirkninger/thc--sativex-munnspray-11-8809.json'
          npm run -s import:bivirkninger -- "$sourcefile" > /tmp/forhandsvisning.md
          echo 'THC_SPC_PREVIEW_START'
          cat /tmp/forhandsvisning.md
          echo 'THC_SPC_PREVIEW_END'
          npm run -s import:bivirkninger -- "$sourcefile" /tmp/thc_sativex_bivirkninger.sql > /tmp/forhandsvisning2.md
          echo 'THC_SPC_SQL_START'
          cat /tmp/thc_sativex_bivirkninger.sql
          echo
          echo 'THC_SPC_SQL_END'
          PY

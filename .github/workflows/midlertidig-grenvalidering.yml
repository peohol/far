name: Midlertidig grenvalidering

on:
  push:
    branches:
      - fix/kanoniske-fagsider

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Berorte tester
        run: npm test -- src/domain/__tests__/analyttkatalog.test.ts src/domain/__tests__/stoffregister.test.ts src/__tests__/navigasjon.test.tsx
      - name: Build
        run: npm run build

name: Midlertidig grenvalidering

on:
  push:
    branches:
      - fix/kanoniske-fagsider

concurrency:
  group: kanoniske-fagsider-validering
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full testsuite
        run: npm test
      - name: Build
        run: npm run build

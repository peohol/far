name: Midlertidig grenvalidering

on:
  push:
    branches:
      - fix/kanoniske-fagsider

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generer migrasjonsnavn
        run: |
          npm exec supabase -- migration new kanonisk_bupropionside
          find supabase/migrations -maxdepth 1 -name '*_kanonisk_bupropionside.sql' -print
      - name: Typecheck
        run: npm run typecheck
      - name: Full testsuite
        run: npm test
      - name: Build
        run: npm run build

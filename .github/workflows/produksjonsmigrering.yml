# Ruller migrasjonene ut til produksjonsdatabasen etter sammenslåing til main
# (docs/migrasjoner.md). Kjører bare på main: aldri på PR-er eller andre grener.
name: Produksjonsmigrering

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      # Og selve utrullingen, så en endring i den prøves med en gang.
      - .github/workflows/produksjonsmigrering.yml
      - scripts/produksjonsmigrering.ts
      - scripts/migrasjonsmappe.ts
      - src/faginnhold/migrasjonshistorikk.ts
  workflow_dispatch:

permissions:
  contents: read

# Aldri to utrullinger mot databasen samtidig: en ny kjøring venter på den forrige.
concurrency:
  group: supabase-produksjon
  cancel-in-progress: false

jobs:
  migrer:
    name: Migrer produksjonsdatabasen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Hemmelighetene ligger i miljøet, som bare main får bruke.
    environment: produksjon
    env:
      # Prosjekt-ref-en til OUSFAR i Supabase. Den er ikke hemmelig (den står i
      # appens adresse); `project_id` i supabase/config.toml er bare navnet på det
      # lokale oppsettet.
      SUPABASE_PROJECT_REF: jfzqowsmjtthpbipnxnf
    steps:
      - name: Kontroller at tilgangen er satt opp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Hemmeligheten SUPABASE_ACCESS_TOKEN mangler i miljøet «produksjon» (se docs/migrasjoner.md)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Uten installasjonsskript, og før hemmelighetene er i miljøet.
      - run: npm ci --ignore-scripts

      - name: Lenk prosjektet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Forkontroll og tørrkjøring
        id: forkontroll
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run -s produksjonsmigrering -- forkontroll

      - name: Rull ut migrasjonene
        if: steps.forkontroll.outputs.ventende != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run -s produksjonsmigrering -- utrull

      - name: Etterkontroll av historikken
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run -s produksjonsmigrering -- etterkontroll

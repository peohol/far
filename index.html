<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Verktøy for å kommentere farmakologiske analyser." />
    <title>Kommentarverktøy for farmakologiske analyser</title>
    <script>
      // Settes før første maling slik at siden ikke blinker i feil tema.
      // Mørkt er standard; et lagret valg går foran.
      try {
        var lagret = localStorage.getItem('far:tema')
        document.documentElement.dataset.tema = lagret === 'lyst' ? 'lyst' : 'moerkt'
      } catch (e) {
        document.documentElement.dataset.tema = 'moerkt'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
